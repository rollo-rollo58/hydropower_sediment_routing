services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dam_app
      POSTGRES_PASSWORD: local_dev_only
      POSTGRES_DB: dam_ops
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U dam_app -d dam_ops']
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
  api:
    image: python:3.12-slim
    working_dir: /srv/backend
    volumes:
      - ./backend:/srv/backend
    command: sh -c "pip install -e . && python -m app.main"
    environment:
      PORT: '8000'
      DATABASE_URL: postgresql+psycopg://dam_app:local_dev_only@db:5432/dam_ops
    ports:
      - '8000:8000'
    depends_on:
      db:
        condition: service_healthy
  web:
    image: node:22-alpine
    working_dir: /srv/frontend
    volumes:
      - ./frontend:/srv/frontend
    command: sh -c 'npm install && npm run dev -- --hostname 0.0.0.0'
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - '3000:3000'
    depends_on:
      - api
