[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reservoir-operations-simulator"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "flask>=3,<4",
  "flask-cors>=4,<6",
  "flask-sock>=0.7,<1",
  "sqlalchemy>=2,<3",
  "psycopg[binary]>=3,<4",
  "pydantic>=2,<3",
  "redis>=5,<7",
  "rq>=1.16,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.5,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
